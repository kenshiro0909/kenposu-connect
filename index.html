<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ケンポスくん｜連携</title>
<style>
:root{--ink:#18203A;--gold:#E7C27A;--bg:#ECEEF2;--sub:#5B6480}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);padding:16px}
.card{background:#fff;border-radius:20px;padding:32px 28px;width:min(440px,100%);text-align:center;box-shadow:0 20px 50px rgba(24,32,58,.12)}
.logo{width:64px;height:64px;margin:0 auto 14px;border-radius:16px;overflow:hidden}
h1{font-size:20px;margin:0 0 10px}p{margin:0;color:var(--sub);line-height:1.7;font-size:14px}
.spin{width:28px;height:28px;border:3px solid #dfe2ea;border-top-color:var(--ink);border-radius:50%;margin:18px auto 0;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.ok{color:#2E9E6B}.ng{color:#D2453A}
.small{margin-top:16px;font-size:12px;color:#9AA1B5}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><svg viewBox="0 0 80 80" width="64" height="64"><rect width="80" height="80" fill="#18203A"/><circle cx="40" cy="40" r="29" fill="none" stroke="#E7C27A" stroke-width="1.8"/><circle cx="40" cy="40" r="25.5" fill="none" stroke="#E7C27A" stroke-width=".7"/><text x="38.55" y="50" text-anchor="middle" font-size="27" font-weight="600" letter-spacing="-2.5" fill="#E7C27A" font-family="'Hiragino Mincho ProN','Yu Mincho',serif">KP</text></svg></div>
  <h1 id="t">連携しています…</h1>
  <p id="m">そのままお待ちください（数秒〜20秒ほど）</p>
  <div class="spin" id="sp"></div>
  <p class="small" id="s"></p>
</div>
<script>
(function () {
  var q = {};
  (location.search.slice(1) + '&' + location.hash.slice(1)).split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) q[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' ')); });
  function show(ok, title, msg) {
    document.getElementById('sp').style.display = 'none';
    var t = document.getElementById('t'); t.textContent = title; t.className = ok ? 'ok' : 'ng';
    document.getElementById('m').textContent = msg;
    document.getElementById('s').textContent = ok ? 'このタブは閉じて大丈夫です。ケンポスくんの「連携」に追加されています。' : 'ケンポスくんの「連携」から、もう一度つないでみてください。';
  }
  if (q.error) return show(false, '連携できませんでした', q.error_description || q.error);
  var parts = String(q.state || '').split('.');
  if (!q.code || parts.length < 4 || !/^[A-Za-z0-9_-]+$/.test(parts[3])) return show(false, '連携できませんでした', 'このページは、ケンポスくんの「つなぐ」から開いた時だけ使えます。');
  var url = 'https://script.google.com/macros/s/' + parts[3] + '/exec';
  fetch(url, {method: 'POST', credentials: 'omit', redirect: 'follow', body: JSON.stringify({action: 'oauth', code: q.code, state: q.state})})
    .then(function (r) { return r.json(); })
    .then(function (j) { show(!!j.ok, j.title || (j.ok ? '連携できました' : '連携できませんでした'), j.message || ''); })
    .catch(function (e) { show(false, '連携できませんでした', '通信できませんでした。時間をおいて、もう一度つないでください。（' + e + '）'); });
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
})();
</script>
</body>
</html>
